internships:
  - id: haco
    organization: Beijing Academy of Artificial Intelligence (BAAI)
    location: Beijing, China
    role: Research Intern
    period: Jun. 2026 – Sep. 2026
    project: "HACo: Haptic Active Compliance for Dexterous Manipulation"
    paper_url: "https://arxiv.org/abs/2609.36596"
    paper_label: "arXiv:2609.36596"
    summary: Built compliant teleoperation and a tactile-conditioned VLA policy for dexterous manipulation, achieving 83% mean success across five real-robot tasks.
    details:
      - Built compliant dual-arm teleoperation and collected **500 multimodal demonstrations** across five force-sensitive tasks.
      - Conditioned a pretrained VLA policy on fingertip tactile and joint-torque feedback using a haptic encoder.
      - Trained a flow-matching policy and deployed real-time action chunking for closed-loop control.
      - Achieved **83% mean success** across five real-robot tasks, versus **35%** for the strongest evaluated baseline.
  - id: msra
    organization: Microsoft Research Asia (MSRA)
    location: Beijing, China
    role: Research Intern
    period: Jun. 2024 – Sep. 2024
    project: Fine-Tuning Mixtral 8x7B on Biochemical Molecular Data
    summary: Fine-tuned Mixtral 8x7B for molecular property prediction using PubChem data and SMILES-neighbor retrieval, improving test accuracy from 67% to 77%.
    details:
      - Constructed and preprocessed a PubChem-based dataset for molecular property prediction tasks.
      - Implemented KNN retrieval over SMILES representations to provide similar-molecule context for in-context learning.
      - Fine-tuned Mixtral 8x7B and refined the evaluation protocol, improving test accuracy from **67% to 77%**.
      - "**Tech:** Python, Git, VS Code."

research:
  - id: event-tactile
    organization: Johns Hopkins University × TU Darmstadt
    location: Baltimore, MD, USA
    role: Graduate Researcher
    period: Nov. 2025 – Present
    project: Event-Based Visuo-Tactile Sensing for Robot Imitation Learning
    summary: Building a synchronized RGB, tactile, and event-based imitation-learning pipeline for contact-rich robot manipulation.
    details:
      - Building a multimodal imitation-learning pipeline that fuses RGB, tactile, and event streams on a UR5 arm with a UMI gripper, targeting contact, slip, and fast-motion cues missed by RGB-only policies.
      - Built a VIVE-based teleoperation setup and multi-rate data pipeline, aligning RGB (30 Hz), tactile/event (120 Hz), and 3D pose (75 Hz) into observation–action samples.
      - Implemented and tested initial **Diffusion Policy** and **Flow Matching** baselines for the UR5 arm and UMI gripper.
  - id: biosignals
    organization: University of Macau
    location: Macao SAR
    role: Final Year Project — Faculty Dean's Honors List
    period: Sep. 2024 – May 2025
    project: Singular Spectrum Analysis for Biosignal Denoising and Feature Extraction
    summary: Developed a two-level Singular Spectrum Analysis method to denoise ECG and EEG signals and recover physiological features.
    details:
      - Designed a two-level Singular Spectrum Analysis framework combining component correlation and waveform reconstruction for ECG and EEG signal analysis.
      - Localized ECG PQRST features and removed EEG artifacts while preserving neural rhythms across delta, theta, alpha, and beta bands.
      - Validated the method on synthetic and real recordings, recovering physiological patterns such as eyes-open vs. eyes-closed alpha rhythm differences.
      - "**Tech:** Python, NumPy, SciPy, Matplotlib, NeuroKit2."
  - id: neural-decoding
    organization: City University of Hong Kong
    location: Hong Kong SAR
    role: Research Assistant
    period: May 2023 – Aug. 2023
    project: Neural Decoding for Implantable Brain–Machine Interfaces with ANN and SNN
    summary: Benchmarked ANN and SNN decoders on primate neural recordings for implantable brain–machine interfaces.
    details:
      - Preprocessed raw primate neural recordings into supervised datasets with movement coordinates, finger positions, and spike trains.
      - Designed and benchmarked ANN and SNN decoders for neural decoding, comparing accuracy–efficiency trade-offs for implantable BMI scenarios.
      - "**Tech:** Python, MATLAB."
  - id: fpga-biomedical
    organization: University of Macau
    location: Macao SAR
    role: Research Assistant
    period: May 2022 – Jul. 2022
    project: FPGA-Based Hardware Time-Triggered System for Biomedical Engineering
    summary: Implemented FPGA signal conditioning and a deterministic time-triggered architecture for biomedical data acquisition.
    details:
      - Implemented FPGA-based signal conditioning and filtering pipelines in Quartus for biomedical data acquisition.
      - Refined hardware architecture and I/O interfaces to support deterministic time-triggered behavior.
      - "**Tech:** Quartus, MATLAB."

