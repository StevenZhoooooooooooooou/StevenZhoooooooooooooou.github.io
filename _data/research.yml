haco:
  id: haco
  title: "HACo: Learning Haptic Active Compliance for Force-Aware Dexterous Manipulation"
  author: "Yinzhe Zhou"
  authors:
    - Naisheng Ye
    - Yinzhe Zhou
    - Junkai Zhao
    - Yuhang Lu
    - Checheng Yu
    - Zhenjie Yang
    - Pengwei Wang
    - Hongyang Li
  status: "arXiv preprint"
  arxiv_id: "2609.36596"
  url: "https://arxiv.org/abs/2609.36596"
  year: 2026
  organization: "Beijing Academy of Artificial Intelligence (BAAI)"
  role: "Research Intern"
  period: "Jun – Sep 2026"
  summary: "HACo combines compliant teleoperation and haptic-conditioned policy learning for force-sensitive manipulation, achieving 83% mean success across five real-robot tasks."

