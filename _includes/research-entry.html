{% assign research = site.data.research.haco %}
<article class="research-entry">
  <div class="research-context"><span class="eyebrow">BAAI</span><p>{{ research.role }}<br>{{ research.period }}</p></div>
  <div><h3><a href="{{ '/research/' | relative_url }}#haco">{{ research.title }}</a></h3><p class="authorship"><strong>{{ research.author }}</strong><span class="author-divider" aria-hidden="true">/</span>{{ research.position }}</p><p class="cv-role">Unpublished manuscript, 2026.</p></div>
</article>
